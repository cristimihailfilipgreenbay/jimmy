services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jimmy
      POSTGRES_PASSWORD: jimmy
      POSTGRES_DB: jimmy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jimmy -d jimmy"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://jimmy:jimmy@db:5432/jimmy
      # Bare names: taken from your shell if set, otherwise from .env.
      OPENROUTER_API_KEY:
      LANGSMITH_API_KEY:
      TAVILY_API_KEY:
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
