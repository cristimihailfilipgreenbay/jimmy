services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jimmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jimmy}
      POSTGRES_DB: ${POSTGRES_DB:-jimmy}
    ports:
      # Only this machine can reach it, for database tools on the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jimmy} -d ${POSTGRES_DB:-jimmy}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the stack the database is "db" on its own port, whatever
      # POSTGRES_PORT (the port published on your machine) says in .env.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-jimmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jimmy}
      POSTGRES_DB: ${POSTGRES_DB:-jimmy}
      # Emptied so a DATABASE_URL meant for running the backend outside Docker
      # cannot override the settings above.
      DATABASE_URL: ""
      # Bare names: taken from your shell if set, otherwise from .env.
      OPENROUTER_API_KEY:
      LANGSMITH_API_KEY:
      TAVILY_API_KEY:
      JWT_SECRET:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
